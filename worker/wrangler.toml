name = "marketmind-worker"
main = "src/index.ts"
compatibility_date = "2024-11-20"

# Environment variables (configure these before deployment)
# Set your API keys using: wrangler secret put <KEY_NAME>
# Or add them in Cloudflare dashboard under Workers > Settings > Environment Variables

[vars]
# Public configuration (non-sensitive)
WORKER_ENV = "development"
# Workers AI settings (single operator-controlled source; validated in src/core/aiConfig.ts)
# Only the verified GLM adapter model is accepted: @cf/zai-org/glm-4.7-flash
AI_MODEL = "@cf/zai-org/glm-4.7-flash"
AI_MAX_COMPLETION_TOKENS = "2048"
AI_TEMPERATURE = "0.7"

# Native Workers AI binding (no API token required in Worker code)
# `remote = true` keeps local `wrangler dev` on the account AI binding.
[ai]
binding = "AI"
remote = true

# KV Namespaces for caching
[[kv_namespaces]]
binding = "MARKETMIND_CACHE"
id = "058d039ea4434a37930ef46065008254"
preview_id = "bc5f8aacaae74efc9667caf22040f2c1"

# Secrets (set via wrangler secret put or dashboard):
# - FINNHUB_API_KEY          # Stock quotes and live market data
# - TWELVE_DATA_API_KEY      # Historical stock candles
# - COINGECKO_API_KEY        # Crypto market data
# - MARKETAUX_API_TOKEN      # News and sentiment analysis
# - GOLD_API_KEY             # Precious metals pricing
#
# Obsolete (Gemini migration): GEMINI_API_KEY is unused by this Worker.
# Remove it from the Cloudflare dashboard when convenient:
#   wrangler secret delete GEMINI_API_KEY
