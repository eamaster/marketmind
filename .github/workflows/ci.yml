name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - migrate/workers-ai-glm

# Mocked unit tests only — no production deploy and no live Workers AI quota use.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker:
    name: Worker checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Vitest lockfile engines require ^18.17 || ^20.3 || >=21; match frontend CI on 20.
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check (app sources)
        run: npm run type-check

      - name: Type check including tests
        run: npm run type-check:tests

      - name: Unit tests (mocked Workers AI binding)
        run: npm test

      - name: Wrangler deploy dry-run
        run: npx wrangler deploy --dry-run

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc -b --pretty false

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
        env:
          NODE_ENV: production
